<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>🎂 HBD แหนม</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@700;800&family=Mali:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8c8d8;--ink:#221a2e;--brick:#b5482f;--matcha:#8fb56a;--card:#fff7f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3a1f33;--ink:#ffe9f0;--card:#4d2b44}}
:root[data-theme="dark"]{--bg:#3a1f33;--ink:#ffe9f0;--card:#4d2b44}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:Mali,Prompt,sans-serif;font-size:18px;display:flex;justify-content:center}
#app{width:100%;max-width:460px;padding:24px 20px 40px;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center;position:relative}
h1{font-family:Prompt,sans-serif;font-weight:800;font-size:clamp(26px,8vw,36px);line-height:1.25;margin:0}
p{margin:0;line-height:1.6}
.btn{font-family:Prompt,sans-serif;font-weight:700;font-size:18px;color:#221a2e;background:var(--matcha);border:3px solid #221a2e;border-radius:14px;padding:12px 22px;box-shadow:4px 4px 0 #221a2e;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #221a2e}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--brick);outline-offset:3px}
.btn.no{background:var(--brick);color:#fff}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;min-height:64px;align-items:center}
input{font:inherit;padding:12px 14px;border:3px solid #221a2e;border-radius:14px;background:var(--card);color:var(--ink);text-align:center;width:100%}
.pol{background:#fff;color:#221a2e;padding:10px 10px 12px;border-radius:6px;box-shadow:0 6px 18px #0004;transform:rotate(-2deg);align-self:center;width:78%}
.pol.r{transform:rotate(2.5deg)}
.pol img{display:block;width:100%;max-height:44vh;object-fit:cover;border-radius:3px}
.pol small{display:block;margin-top:8px;font-size:14px}
.bar{height:22px;border:3px solid #221a2e;border-radius:12px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--matcha);transition:width .4s}
#conf{position:fixed;inset:0;pointer-events:none;z-index:5}
svg{max-width:100%;height:auto}
.fl{transform-origin:50% 100%;animation:fk .35s infinite alternate;transition:opacity .3s}
.out .fl{opacity:0;animation:none}
@keyframes fk{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.12) rotate(3deg)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .pol{width:100%;padding:6px}
.grid .pol img{max-height:none;aspect-ratio:1;}
@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.res{text-align:left;display:flex;flex-direction:column;gap:10px}
.tr{background:var(--card);border:3px solid #221a2e;border-radius:12px;padding:10px 14px;line-height:1.5}.tr b{font-family:Prompt,sans-serif}.tr small{display:block;font-size:14px;opacity:.85}
</style></head><body><div id="app"></div><canvas id="conf"></canvas>

const pol=(i,c,r)=>`<div class="pol ${r?'r':''}"><img src="${IMG[i]}" alt=""><small>${c}</small></div>`;

const P=[
{h:()=>`<h1>🚨 เว็บนี้ล็อกไว้<br>เฉพาะคนพิเศษเท่านั้น</h1><p>พิมพ์ชื่อของคุณเพื่อยืนยันตัวตนก่อนเข้าชม</p><input id="nm" placeholder="ชื่อเล่น" maxlength="20" autocomplete="off"><div class="row"><button class="btn" id="go">ยืนยันตัวตน</button></div>`,
 i:()=>{$('#go').onclick=()=>{name=$('#nm').value.trim()||name;next()}}},
{h:()=>`<h1>ตรวจพบผู้ต้องสงสัย</h1>${pol(3,'ยิ้มตาหยี ชูสองนิ้ว ถือถุงช้อปปิ้ง')}<p>คนในรูปคือ <b>${name}</b> ใช่ไหม?</p><div class="row" id="rw"><button class="btn" id="y">ใช่</button><button class="btn no" id="n">ไม่ใช่</button></div>`,

 b.onclick=()=>{c--;if(c<=0){next();return}b.textContent=`${m[4-c]||''} · อีก ${c}`;b.style.transform=`translate(${(Math.random()-.5)*120}px,${(Math.random()-.5)*60}px)`}}},

 i:()=>{const f=t=>{$('#rs').textContent=t;$('.row').innerHTML='<button class="btn" id="nx">ไปเป่าเค้ก</button>';$('#nx').onclick=next};$('#a').onclick=()=>f('ถูกต้อง! เสื้อสีส้มคือคำตอบ 🧡');$('#b').onclick=()=>f('ถูกต้อง! เสื้อสีเขียวก็ไม่แพ้ 💚 ข้อนี้ตอบอะไรก็ถูก')}},
{h:()=>{const x=[80,115,150,185,220];return `<h1>เป่าเทียนได้เลย 🕯️</h1><p>แตะปุ่มไมค์แล้วเป่าใส่มือถือ หรือกดเป่าเอาก็ได้</p>
<svg viewBox="0 0 300 240" id="ck" role="img" aria-label="เค้กวันเกิด"><ellipse cx="150" cy="222" rx="125" ry="12" fill="#0002"/><rect x="40" y="150" width="220" height="70" rx="10" fill="#b5482f"/><rect x="60" y="105" width="180" height="50" rx="10" fill="#f8c8d8" stroke="#221a2e" stroke-width="3"/><path d="M60 125q15 22 30 0t30 0 30 0 30 0 30 0v-10H60z" fill="#fff"/><rect x="40" y="150" width="220" height="70" rx="10" fill="none" stroke="#221a2e" stroke-width="3"/>
${x.map((v,i)=>`<g class="cd" id="c${i}"><rect x="${v-4}" y="70" width="8" height="36" fill="${i%2?'#8fb56a':'#fff'}" stroke="#221a2e" stroke-width="2"/><ellipse class="fl" cx="${v}" cy="58" rx="7" ry="13" fill="#ffb020" stroke="#ff5a3c" stroke-width="2"/></g>`).join('')}</svg>
<div class="row"><button class="btn" id="mic">🎤 เป่าใส่ไมค์</button><button class="btn no" id="bl">💨 กดเป่า</button></div><p id="st"></p>`},
 i:()=>{let left=[0,1,2,3,4],done=false;const kill=()=>{if(!left.length||done)return;const k=left.splice(Math.floor(Math.random()*left.length),1)[0];$('#c'+k).classList.add('out');if(!left.length){done=true;setTimeout(fin,700)}};
 $('#bl').onclick=kill;$('#ck').onclick=kill;
 $('#mic').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const ac=new (window.AudioContext||window.webkitAudioContext)(),an=ac.createAnalyser();ac.createMediaStreamSource(s).connect(an);const d=new Uint8Array(an.fftSize);$('#st').textContent='เป่าเลย! 🌬️';let last=0;
 (function lp(){an.getByteTimeDomainData(d);let m=0;for(const v of d)m=Math.max(m,Math.abs(v-128));if(m>60&&Date.now()-last>350){last=Date.now();kill()}if(!done)requestAnimationFrame(lp);else s.getTracks().forEach(t=>t.stop())})()}catch(e){$('#st').textContent='ใช้ไมค์ไม่ได้ ไม่เป็นไร กดปุ่มเป่าแทนนะ 😆'}}}}
];
const F="แหนม";
function fin(){app.innerHTML=`<h1 style="font-size:clamp(34px,11vw,52px)">🎉 HAPPY<br>BIRTHDAY<br>${F}! 🎂</h1><div class="grid">${pol(3,'',0)}${pol(2,'',1)}${pol(0,'',1)}${pol(6,'',0)}${pol(4,'',1)}${pol(1,'',0)}${pol(5,'',1).replace('class="pol','style="grid-column:1/-1;justify-self:center;width:60%" class="pol')}</div><p>HBD ${F} ขอให้มีความสุขที่สุด กินๆ จอยๆ ตลอดไป ไว้รอหาเวลาไปเที่ยวต่างประเทศกันอีก สนุกมากจริง ขอให้เจอแต่เรื่องดีๆ ที่ทำงานดีๆ ไม่เครียด เพี้ยง 🙏</p><p>ก่อนไป... ขอจัดชุดสกินแคร์ให้เป็นของขวัญ 🧴</p><div class="row"><button class="btn" id="sc">🧴 ดูสกินแคร์ที่ควรใช้</button><button class="btn no" id="re">เป่าอีกรอบ</button></div>`;$('#re').onclick=()=>{step=P.length-1;render()};$('#sc').onclick=scan;boom()}
function scan(){app.innerHTML=`<h1>🧴 กำลังจัดชุดสกินแคร์</h1><p id="sm">เริ่มวิเคราะห์...</p><div class="bar"><i id="sb"></i></div>`;const m=['กำลังนับมื้ออาหารต่อวัน...','กำลังคำนวณความเครียดจากที่ทำงาน...','กำลังเช็กแผนเที่ยวต่างประเทศรอบหน้า...','จัดชุดเสร็จแล้ว!'];let k=0;const t=setInterval(()=>{$('#sm').textContent=m[k];$('#sb').style.width=(k+1)*25+'%';k++;if(k>=m.length){clearInterval(t);setTimeout(result,700)}},1000)}
function result(){const L=[['🧼 คลีนเซอร์อ่อนโยน','กินจอยๆ ทุกวัน ล้างหน้าให้สะอาดแต่ไม่แห้งตึง เลือกสูตรอ่อนโยน'],['☀️ กันแดด SPF50+ PA++++','ตัวหลักที่สุด โดยเฉพาะตอนไปเที่ยวต่างประเทศ ทาทุกเช้า และทาซ้ำถ้าอยู่กลางแจ้งนาน'],['💧 มอยส์เจอไรเซอร์ (เซราไมด์ / แพนทีนอล)','เก็บความชุ่มชื้น ช่วยให้ผิวนุ่มแม้ทำงานเหนื่อย'],['✨ เซรั่มไนอาซินาไมด์ หรือวิตามินซี','ช่วยให้ผิวดูกระจ่างใส เริ่มจากความเข้มข้นต่ำก่อน'],['😴 มาส์กหน้า + นอนให้พอ','สกินแคร์ที่ดีที่สุดสำหรับคนทำงานคือการนอนหลับ (ข้อนี้ฟรี)']];
app.innerHTML=`<h1>🧴 ชุดสกินแคร์ของ${F}</h1><div class="pol r"><img src="${IMG[3]}" alt=""></div><div class="res">${L.map(x=>`<div class="tr"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div><p style="font-size:14px">* เป็นคำแนะนำทั่วไปแบบขำๆ ไม่ใช่การวินิจฉัยผิว ผิวแต่ละคนต่างกัน ควรลองใช้ทีละตัว ถ้ามีปัญหาผิวควรปรึกษาแพทย์ผิวหนัง</p><p>สุขสันต์วันเกิด ${F} 🎂💚</p><div class="row"><button class="btn" id="re">เป่าเค้กอีกรอบ</button></div>`;$('#re').onclick=()=>{step=P.length-1;render()};boom()}
function boom(){const c=$('#conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const col=['#f8c8d8','#8fb56a','#b5482f','#ffb020','#fff'];const ps=Array.from({length:150},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,s:5+Math.random()*7,c:col[Math.random()*5|0],r:Math.random()*6}));let f=0;
 (function a(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(0,0,p.s,p.s*.6);x.restore()});if(f++<400)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
function render(){const p=P[step];app.innerHTML=p.h();p.i();scrollTo(0,0)}
render();
</script></body></html>
